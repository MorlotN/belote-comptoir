[project]
name = "belote-comptoir"
version = "0.1.0"
description = "Belote de comptoir multijoueur : chacun sur son téléphone"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.45"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-dir]
"" = "backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: vrai serveur + navigateur (bin/e2e)"]
addopts = "-m 'not e2e'"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient"]
